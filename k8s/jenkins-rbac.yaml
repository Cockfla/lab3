# Permisos para que el agente de Jenkins pueda aplicar entrega.yaml.
# Aplicar una sola vez:  kubectl apply -f k8s/jenkins-rbac.yaml
# Ajusta el namespace "jenkins" si tu Jenkins/agentes corren en otro.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer-elias-bahamondes
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-deployer-elias-bahamondes
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-deployer-elias-bahamondes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-deployer-elias-bahamondes
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer-elias-bahamondes
    namespace: jenkins
