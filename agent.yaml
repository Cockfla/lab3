# Pod template del agente Kubernetes para Jenkins
# Alumno: Elias Bahamondes
apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: agent-elias-bahamondes
spec:
  # ServiceAccount con permisos para desplegar (ver k8s/jenkins-rbac.yaml)
  serviceAccountName: jenkins-deployer-elias-bahamondes
  containers:
    # install / test: Node + pnpm
    - name: node
      image: node:24-alpine
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
    # build / push: cliente docker hablando con el sidecar dind
    - name: docker
      image: docker:29-cli
      command: ["sleep"]
      args: ["infinity"]
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
    # daemon Docker (Docker-in-Docker)
    - name: dind
      image: docker:29-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      args: ["--host=tcp://0.0.0.0:2375"]
      volumeMounts:
        - name: dind-storage
          mountPath: /var/lib/docker
    # deploy: kubectl
    - name: kubectl
      image: alpine/k8s:1.34.12
      command: ["sleep"]
      args: ["infinity"]
  volumes:
    - name: dind-storage
      emptyDir: {}
